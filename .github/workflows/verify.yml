name: Verify standard and reference tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional schema engine
        run: python -m pip install -r requirements-dev.txt
      - name: Check repository, derived artifacts and file hashes
        run: python tools/check_repository.py
      - name: Validate schemas and example structure
        run: python tools/check_schemas.py
      - name: Validate declared policy at the fixture evidence date
        run: python tools/validate_records.py examples/claims.json examples/evidence.json --as-of 2026-10-27
      - name: Run behavioral and schema contract tests
        run: python -m unittest discover -s tests -v
