name: Standard change proposal
description: Propose a normative, schema, policy, or conformance change.
title: '[Proposal] '
body:
  - type: markdown
    attributes:
      value: Do not submit private evidence, customer identifiers, or credentials. Proposals do not authorize deployments or changes outside this repository.
  - type: input
    id: version
    attributes:
      label: Standard version and affected requirement IDs
      placeholder: 0.1.0-draft; RBS-CLS-01
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Concrete problem and failure mode
      description: Include an example and counterexample. Identify what a reviewer can establish from actual evidence.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed wording or behavior
    validations:
      required: true
  - type: textarea
    id: effects
    attributes:
      label: Alternatives, adoption cost, and compatibility
      description: Explain the assurance gained or lost, feasible evidence expectations, and required migration.
    validations:
      required: true
